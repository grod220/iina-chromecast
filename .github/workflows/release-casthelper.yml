name: release-casthelper
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install FFmpeg
        run: brew list ffmpeg || brew install ffmpeg
      - run: npm ci
      - run: npm test
      - run: sh scripts/build-helper.sh --universal
      - run: npm run package
      - name: Archive plugin bundle
        run: ditto -c -k --keepParent build/iina-chromecast.iinaplugin build/iina-chromecast.iinaplugin.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            build/casthelper
            build/iina-chromecast.iinaplugin.zip
